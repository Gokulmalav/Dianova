name: dianova
description: Dianova - AI Diabetes Risk Prediction App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1

  # UI & Charts
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3

  # State & Storage
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Fonts & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
